<!DOCTYPE html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap&text=%E8%BF%B7">
<style>
  :root{--ink:#0c0b0d;--paper:#efebe3;--accent:#f0484d}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 70% 60% at 50% 48%,#1d1b1f 0%,var(--ink) 72%);color:var(--paper);font-family:"Archivo","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .pg{position:relative;width:min(92vw,calc((100svh - 48px) * .72));aspect-ratio:.72;container-type:size;background:var(--ink);box-shadow:0 30px 60px -24px rgba(0,0,0,.75);display:flex;flex-direction:column;padding:5cqh;overflow:hidden}
  .run{display:flex;justify-content:space-between;font-size:max(10px,1.2cqh);letter-spacing:.2em;text-transform:uppercase;font-weight:600;padding-bottom:1cqh;border-bottom:1px solid rgba(239,235,228,.2)}
  .k{position:absolute;right:-6%;top:12%;font-family:"Noto Serif JP",serif;font-weight:700;font-size:46cqh;line-height:1;opacity:.08}
  .big{font-weight:900;font-stretch:62%;font-size:min(30cqh,60cqw);line-height:.8;letter-spacing:-.02em;margin:auto 0 2cqh;background:linear-gradient(180deg,var(--paper) 35%,rgba(239,235,228,.2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:4.2cqh;line-height:1.05;margin:0 0 2cqh}
  h1 em{font-weight:400;color:var(--accent)}
  p{font-size:max(13px,1.8cqh);line-height:1.5;margin:0 0 3cqh;max-width:36ch;color:#a29d95}
  a{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 1.8em;border:1px solid currentColor;border-radius:999px;color:var(--paper);text-decoration:none;font-size:max(10px,1.2cqh);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  a:hover{background:var(--paper);color:var(--ink)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .fo{margin-top:4cqh;display:flex;justify-content:space-between;padding-top:1cqh;border-top:1px solid rgba(239,235,228,.2);font-size:max(10px,1.2cqh);letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
  <main class="pg">
    <div class="k" aria-hidden="true">迷</div>
    <div class="run"><span>Errata</span><span>404</span></div>
    <p class="big" aria-hidden="true">404</p>
    <h1>This page was <em>torn out.</em></h1>
    <p>The page you were looking for is not in this issue. The whole portfolio is one magazine, so the cover is the best place to start.</p>
    <a href="/">Back to the cover</a>
    <div class="fo"><span>NJERU · No. 01</span><span>Errata</span></div>
  </main>
